plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.148'
}

// Horsing Around for Minecraft 1.21.1 on NeoForge, a single-version build of the upstream mod
// (https://github.com/GabePurc/horsing-around, its 1.21.1-neoforge node).
version = "${project.mod_version}+${project.minecraft_version}"
base.archivesName = 'horsing-around-neoforge'

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

// The client-only code has a source set of its own (src/client) and goes into the same jar.
sourceSets {
	client {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}
configurations {
	clientCompileOnly.extendsFrom compileOnly
	clientRuntimeOnly.extendsFrom runtimeOnly
}

def auditDir = { String side -> layout.buildDirectory.dir("run/audit/${side}").get().asFile }

neoForge {
	enable {
		version = project.neoforge_version
		// Compile against Minecraft's own classes (binary-patched), not a decompiled and recompiled copy. Upstream's
		// releases are built so (on CI, where ModDevGradle turns recompilation off), and the two differ in what javac
		// sees: vanilla's bridge methods carry no ACC_BRIDGE flag, so javac adds bridges of its own to subclasses (e.g.
		// HorseSettingsScreen$TackList.getFocused). -PminecraftSources recompiles, for browsing the game's source in an
		// IDE; jars built so are not the release's.
		disableRecompilation = !project.hasProperty('minecraftSources')
	}
	addModdingDependenciesTo sourceSets.client

	mods {
		"horsingaround" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			sourceSet = sourceSets.client
			loadedMods = [mods.horsingaround]
		}
		client {
			client()
			gameDirectory = project.file('run')
			// -Pconnect=<host[:port]>: join that server straight from launch (e.g. -Pconnect=localhost with runServer up).
			if (project.hasProperty('connect')) {
				programArguments.addAll('--quickPlayMultiplayer', project.property('connect').toString())
			}
		}
		server {
			server()
			gameDirectory = project.file('run/server')
			programArgument '--nogui'
		}
		// ./gradlew auditMixins (below)
		auditClient {
			client()
			gameDirectory = auditDir('client')
			systemProperty 'horsingaround.audit', 'true'
			systemProperty 'mixin.debug.countInjections', 'true'
		}
		auditServer {
			server()
			gameDirectory = auditDir('server')
			programArgument '--nogui'
			systemProperty 'horsingaround.audit', 'true'
			systemProperty 'mixin.debug.countInjections', 'true'
		}
	}
}

dependencies {
	// Optional integration: ride the horse's real animated body when Entity Model Features animates it.
	compileOnly "maven.modrinth:entity-model-features:${project.emf_version}"
	compileOnly "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	// Optional integration: the riding camera steps aside while Shoulder Surfing Reloaded drives the camera.
	compileOnly "maven.modrinth:shoulder-surfing-reloaded:${project.shoulder_surfing_version}"

	// Dev only: Entity Model Features and Entity Texture Features in the dev games, the upstream mod's target setup
	// (leave them out with -Pplain).
	if (!project.hasProperty('plain')) {
		runtimeOnly "maven.modrinth:entity-model-features:${project.emf_version}"
		runtimeOnly "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	}
}

def resourceProps = [version: project.version.toString()]
tasks.named('processResources') {
	inputs.properties resourceProps
	filesMatching('META-INF/neoforge.mods.toml') {
		expand resourceProps
	}
}

jar {
	from sourceSets.client.output
	from(files('COPYING', 'COPYING.LESSER')) {
		rename { "${it}_horsingaround" }
	}
}

// ./gradlew auditMixins: a dev client and a dedicated server each load every class the mixins patch (MixinAudit), then
// quit. Fails unless both report the audit passed and nothing in the log names a mixin failure.
def auditRuns = ['Client', 'Server']
auditRuns.eachWithIndex { side, i ->
	def dir = auditDir(side.toLowerCase())
	tasks.named("runAudit${side}") {
		group = 'verification'
		if (i > 0) mustRunAfter "runAudit${auditRuns[i - 1]}"
		doFirst {
			new File(dir, 'logs').deleteDir()
			dir.mkdirs()
			new File(dir, 'eula.txt').text = 'eula=true\n'
			if (side == 'Client') {
				new File(dir, 'options.txt').text = 'soundCategory_master:0.0\n'
			} else {
				new File(dir, 'server.properties').text = 'server-port=0\n'
			}
		}
		doLast {
			def log = new File(dir, 'logs/latest.log')
			def text = log.exists() ? log.text : ''
			def problems = text.readLines().findAll { it =~ /Mixin apply for mod|Mixin apply failed|Injection validation failed|could not find any targets|InvalidInjectionException|InvalidMixinException|MixinApplyError|MixinTransformerError|Critical injection failure/ }
			if (!text.contains('Horsing Around mixin audit passed') || !problems.isEmpty()) {
				throw new GradleException("Mixin audit failed (${side.toLowerCase()}); see ${log}\n" + problems.take(20).join('\n'))
			}
			logger.lifecycle("Mixin audit passed (${side.toLowerCase()}).")
		}
	}
}
tasks.register('auditMixins') {
	group = 'verification'
	dependsOn auditRuns.collect { "runAudit${it}" }
}
